name: Natal que Vende - QA Mobile and Desktop
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax and content
        run: |
          node --check assets/js/app.js
          node --check assets/js/config.js
          node --check portal/app.js
          node --check portal/upload.js
          node --check upsell/app.js
          test -f upsell/index.html
          test -f upsell/styles.css
          test -f portal/upload.html
          test -f portal/supabase/module-progress-20261023.sql
          test -f portal/supabase/sequential-resource-gate-20261023.sql
          node --check portal/config.js
          test -f portal/supabase/schema.sql
          test -f portal/supabase/functions/cakto-webhook/index.ts
          test -f portal/index.html
          test -f index.html
          test -f assets/images/logo-natal-que-vende-transparente.webp
          test -f assets/images/dashboard.webp
      - name: Install minimal browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright-core
      - name: Locate Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
      - name: Start static local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nqv-http.log 2>&1 &
          echo $! > /tmp/nqv-http.pid
          sleep 2
      - name: Run 7 mobile-desktop viewports and controls
        run: node tests/smoke.mjs
      - name: Test members portal across 7 viewports
        run: node tests/portal-smoke.mjs
      - name: Test gated membership and protected module navigation
        run: node tests/portal-membership.mjs
      - name: Test external Christmas upsell page on seven viewports
        run: node tests/upsell-smoke.mjs
