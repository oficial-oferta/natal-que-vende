name: Deploy Natal que Vende - GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the current site
        uses: actions/checkout@v4
      - name: Verify build output
        run: |
          test -f index.html
          test -f assets/css/styles.css
          test -f assets/js/app.js
          test -f assets/images/logo-natal-que-vende-transparente.webp
          node --check assets/js/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
