name: One-time image performance optimization
on:
  push:
    paths:
      - .github/workflows/optimize-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image encoder
        run: npm install --no-save --no-audit --no-fund sharp
      - name: Generate optimized logo and mobile hero
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          const logo='assets/images/logo-natal-que-vende-v2.png';
          const newLogo='assets/images/logo-natal-que-vende-v2.webp';
          const sourceHero='assets/images/mesa.webp';
          const mobileHero='assets/images/mesa-mobile.webp';
          await sharp(logo).webp({quality:89,effort:6,alphaQuality:100}).toFile(newLogo);
          await sharp(sourceHero).resize({width:760,withoutEnlargement:true}).webp({quality:72,effort:6}).toFile(mobileHero);
          for (const f of [logo,newLogo,sourceHero,mobileHero]) console.log(f, (await fs.stat(f)).size);
          NODE
      - name: Commit optimized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/logo-natal-que-vende-v2.webp assets/images/mesa-mobile.webp
          git diff --cached --quiet && exit 0
          git commit -m "Optimize logo and hero images for mobile performance"
          git push
