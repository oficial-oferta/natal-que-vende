name: Import updated Natal que Vende logo
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-logo.yml
permissions:
  contents: write
jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download updated transparent logo
        env:
          SOURCE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fc7d4513f-4f03-4b16-b19e-df6884edb651/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADm30aCO8qgIbA3slbqa-e7Oj9gDJLMS-3J1b2y2hJNU&exp=1792647985&osig=AAAAAAAAAAAAAAAAAAAAAF2FHMGNe6_i8yeQwsY0R0R-DCt39J4X3BQmyZZRmXp-&signer=media-rpc&token=AAIAAU0AJGM3ZDQ1MTNmLTRmMDMtNGIxNi1iMTllLWRmNjg4NGVkYjY1MQAAAAABoWIld2j9iyBab99ZFGQCx2fK8AKq-JDKNHVROvJRXVQk5FjRaw&x-canva-quality=thumbnail"
        run: |
          mkdir -p assets/images
          curl --fail --location --retry 3 "$SOURCE_URL" --output assets/images/logo-natal-que-vende-v2.png
          file assets/images/logo-natal-que-vende-v2.png
          test $(wc -c < assets/images/logo-natal-que-vende-v2.png) -gt 5000
      - name: Commit logo to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/logo-natal-que-vende-v2.png
          git commit -m "Add revised Natal que Vende logo with alpha transparency" || exit 0
          git push
